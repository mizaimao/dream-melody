<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dream Melody</title>
    <link rel="stylesheet" href="./style.css" />
    <!--
      VexFlow is a UMD bundle, so it is loaded as a classic script and puts
      itself on globalThis. Classic scripts run before module scripts, so it is
      there by the time anything imports the adapter. Everything of ours is an
      ES module, and there is no bundler.
    -->
    <script src="./vendor/vexflow-bravura.js"></script>
  </head>
  <body>
    <header>
      <h1>Dream Melody</h1>
      <p class="tagline">
        A notation editor that stores scale degrees, not pitches.
      </p>
    </header>

    <main>
      <p id="status">loading…</p>
      <p id="key"></p>
      <p class="transport">
        <button id="play" type="button" disabled data-playing="false">Play</button>
        <span class="hint">one oscillator, for checking pitches</span>
      </p>
      <div id="staff" aria-label="Standard staff notation"></div>
      <div id="jianpu" aria-label="Numbered notation (jianpu/简谱)"></div>
      <ul id="problems" hidden></ul>
    </main>

    <footer>
      <p>
        Stage 8: the staff, the numbers, and you can hear both. Note entry
        comes next.
      </p>
    </footer>

    <script type="module" src="./main.js"></script>
  </body>
</html>
