[package]
name = "dream-melody-dev"
description = "Runs Dream Melody locally: serves the app and opens it."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "dream-melody"
path = "src/main.rs"

# No dependencies on purpose. This is a development runner; it should never be
# a reason to audit a supply chain, and the standard library is enough to serve
# a directory over a loopback socket.

[lints.rust]
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
